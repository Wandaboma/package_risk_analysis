[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "package-risk-analysis"
version = "0.3.1"
description = "Reproducible multi-dimensional risk analysis for Rust packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "networkx>=3.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.12",
  "tqdm>=4.65",
]

[project.optional-dependencies]
maintenance = ["torch>=2.0", "prophet>=1.1"]
gharchive = ["orjson>=3.9", "pyarrow>=14"]
dev = ["ruff>=0.5"]

[project.scripts]
package-risk-data = "package_risk_analysis.data:main"

[project.urls]
Repository = "https://github.com/Wandaboma/package_risk_analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
package_risk_analysis = ["resources/*.csv.gz"]

[tool.ruff]
target-version = "py310"
line-length = 100
